# Copied into each empty Gradle home used by the lockfile/checksum refresh (see android/README.md).
# A Gradle home's gradle.properties overrides the project's, so this caps memory where a developer's
# ~/.gradle/gradle.properties no longer applies. Without it, a cold run uses the project's 3 GB heap
# with one worker per CPU core, and has exhausted a 16 GB dev machine.
# Lint runs inside the Gradle JVM and needs about 1 GB of Metaspace; 512m failed lintDebug with an OOM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.options=autoshutdownIdleSeconds=600,autoshutdownUnusedSeconds=300
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
