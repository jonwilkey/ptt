# gitleaks configuration, used by the local git hooks (.githooks/) and by any CI scan.
# Extends the built-in gitleaks rules; add allowlist entries only for verified false positives.
title = "ptt"

[extend]
useDefault = true

# testdata/protocol-vectors.json is generated by server/internal/vectors and holds only synthetic
# keys and secrets (seeds are SHA-256 of public labels). The cross-language tests need them in the
# clear, so the generic-api-key rule is allowed for that one file; every other rule still applies.
[[allowlists]]
description = "synthetic protocol test vectors"
targetRules = ["generic-api-key"]
paths = ['''^testdata/protocol-vectors\.json$''']
