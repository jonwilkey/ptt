---
# Full host configuration. Idempotent: safe to rerun at any time.
#   ansible-playbook site.yml -e pttd_image=<image>@sha256:<digest> [--tags base,...]
# Required values: see inventory/group_vars/prod/site.yml.example.
- name: Configure the ptt production host
  hosts: prod
  become: true
  roles:
    - role: base
      tags: [base]
    - role: tailscale
      tags: [tailscale]
    - role: docker
      tags: [docker]
    - role: app
      tags: [app]
