# Ansible configuration for the ptt host. Run every command from infra/ansible/ so
# this file is picked up (Ansible reads ./ansible.cfg from the working directory).
[defaults]
inventory = inventory/prod.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
# Facts are only read through ansible_facts['...'].
inject_facts_as_vars = False

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
# The host is only reachable over Tailscale, whose WireGuard handshake already
# authenticates the peer by node key, so trust-on-first-use is acceptable. A changed
# host key (for example after a rebuild) is still refused: remove the stale
# known_hosts entry by hand.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new
