---
- name: Check the required app settings
  ansible.builtin.assert:
    that:
      - pttd_image is defined
      - pttd_image is string
      - pttd_image is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
      - ptt_domain is defined
      - ptt_domain is string
      - ptt_domain is match('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
    fail_msg: >-
      pttd_image (pinned by digest: <image>@sha256:<64 hex>) and ptt_domain are
      required. Pass them with -e or set them in inventory/group_vars/prod/site.yml.
    quiet: true

- name: Create the app directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ app_dir }}", owner: root, group: root, mode: "0750"}
    # Owned by the container user so it can read the files when the directory
    # itself is bind-mounted.
    - {path: "{{ app_dir }}/secrets", owner: "{{ app_container_uid }}", group: "{{ app_container_gid }}", mode: "0700"}
    - {path: "{{ app_dir }}/caddy", owner: root, group: root, mode: "0750"}
    # Caddy's certificates and state; persists across container recreation.
    - {path: "{{ app_dir }}/caddy/data", owner: root, group: root, mode: "0700"}
    - {path: "{{ app_dir }}/caddy/config", owner: root, group: root, mode: "0700"}
    - {path: "{{ app_data_dir }}", owner: "{{ app_container_uid }}", group: "{{ app_container_gid }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: Write compose.yaml
  ansible.builtin.copy:
    src: "{{ app_deploy_src_dir }}/compose.yaml"
    dest: "{{ app_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"

# Not secret, and readable by Caddy whatever user its container runs as (the
# parent directory is 0750 root, so host users still cannot read it).
- name: Write the Caddyfile
  ansible.builtin.copy:
    src: "{{ app_deploy_src_dir }}/Caddyfile"
    dest: "{{ app_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: app_caddyfile

- name: Write the compose environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

# Decrypted on the controller (needs sops and an age key there), written as the
# container user so pttd can read the read-only mount.
- name: Write decrypted secrets
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', app_secrets_src_dir ~ '/' ~ item.src, rstrip=false) }}"
    dest: "{{ app_dir }}/secrets/{{ item.dest }}"
    owner: "{{ app_container_uid }}"
    group: "{{ app_container_gid }}"
    mode: "0600"
  loop: "{{ app_secrets }}"
  no_log: true
  diff: false
  register: app_secret_files

- name: Start the services
  vars:
    app_ghcr_login: "{{ ghcr_token | default('') | length > 0 }}"
  block:
    - name: Log in to the container registry
      community.docker.docker_login:
        registry_url: "{{ app_ghcr_registry }}"
        username: "{{ app_ghcr_username }}"
        password: "{{ ghcr_token }}"
        reauthorize: true
      no_log: true
      when: app_ghcr_login | bool

    # Compose recreates containers whose configuration (including .env values)
    # changed, but not ones whose bind-mounted files changed; force that case.
    - name: Pull and start the compose project
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: "{{ app_compose_pull }}"
        recreate: "{{ 'always' if (app_caddyfile is changed or app_secret_files is changed) else 'auto' }}"
        remove_orphans: true
        wait: true
        wait_timeout: "{{ app_compose_wait_timeout }}"

  always:
    - name: Log out of the container registry
      community.docker.docker_login:
        registry_url: "{{ app_ghcr_registry }}"
        state: absent
      when: app_ghcr_login | bool
