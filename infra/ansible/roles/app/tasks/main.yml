---
# Image resolution: an explicit -e pttd_image wins; otherwise the image already
# deployed (PTTD_IMAGE in .env) is kept. With neither (first run before any
# release) the files are written but nothing is started. deploy.yml sets
# app_image_required so a deploy never runs without an explicit image.
- name: Check the required app settings
  ansible.builtin.assert:
    that:
      - ptt_domain is defined
      - ptt_domain is string
      - ptt_domain is match('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
    fail_msg: >-
      ptt_domain is required: set it in inventory/group_vars/prod/site.yml or pass -e.
    quiet: true

- name: Require an explicit image when asked to
  ansible.builtin.assert:
    that:
      - pttd_image is defined
    fail_msg: "This playbook requires -e pttd_image=<image>@sha256:<64 hex>."
    quiet: true
  when: app_image_required | bool

- name: Look for an already deployed environment file
  ansible.builtin.stat:
    path: "{{ app_dir }}/.env"
  check_mode: false
  register: app_env_stat
  when: pttd_image is not defined

- name: Read the already deployed environment file
  ansible.builtin.slurp:
    src: "{{ app_dir }}/.env"
  check_mode: false
  register: app_env_current
  when:
    - pttd_image is not defined
    - app_env_stat.stat.exists | default(false)

- name: Choose the image to run
  ansible.builtin.set_fact:
    app_image: >-
      {{ pttd_image if pttd_image is defined else
         ((app_env_current.content | default('') | b64decode).splitlines()
          | select('match', '^PTTD_IMAGE=') | map('regex_replace', '^PTTD_IMAGE=', '')
          | map('trim') | first | default('')) }}

- name: Check the image is pinned by digest
  ansible.builtin.assert:
    that:
      - app_image is string
      - app_image is match(app_image_pattern)
    fail_msg: >-
      {{ 'pttd_image' if pttd_image is defined else 'PTTD_IMAGE in ' ~ app_dir ~ '/.env' }}
      must be <image>@sha256:<64 hex>, got '{{ app_image }}'.
    quiet: true
  when: pttd_image is defined or app_image | length > 0

- name: Create the app directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ app_dir }}", owner: root, group: root, mode: "0750"}
    # Owned by the container user so it can read the files when the directory
    # itself is bind-mounted.
    - {path: "{{ app_dir }}/secrets", owner: "{{ app_container_uid }}", group: "{{ app_container_gid }}", mode: "0700"}
    - {path: "{{ app_dir }}/caddy", owner: root, group: root, mode: "0750"}
    # Caddy's certificates and state; persists across container recreation.
    - {path: "{{ app_dir }}/caddy/data", owner: root, group: root, mode: "0700"}
    - {path: "{{ app_dir }}/caddy/config", owner: root, group: root, mode: "0700"}
    - {path: "{{ app_data_dir }}", owner: "{{ app_container_uid }}", group: "{{ app_container_gid }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: Write compose.yaml
  ansible.builtin.copy:
    src: "{{ app_deploy_src_dir }}/compose.yaml"
    dest: "{{ app_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"

# Caddy runs as root inside its container, so root-only is enough.
- name: Write the Caddyfile
  ansible.builtin.copy:
    src: "{{ app_deploy_src_dir }}/Caddyfile"
    dest: "{{ app_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0600"
  register: app_caddyfile

- name: Write the compose environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

# Decrypted on the controller (needs sops and an age key there), written as the
# container user so pttd can read the read-only mount.
- name: Write decrypted secrets
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', app_secrets_src_dir ~ '/' ~ item.src, rstrip=false) }}"
    dest: "{{ app_dir }}/secrets/{{ item.dest }}"
    owner: "{{ app_container_uid }}"
    group: "{{ app_container_gid }}"
    mode: "0600"
  loop: "{{ app_secrets }}"
  no_log: true
  diff: false
  register: app_secret_files

- name: Report that nothing is started yet
  ansible.builtin.debug:
    msg: >-
      No pttd_image given and none deployed yet (first run before any release):
      files are in place under {{ app_dir }}, but no image is pulled and no service
      is started. Deploy a release with deploy.yml -e pttd_image=... to start it.
  when: app_image | length == 0

- name: Start the services
  vars:
    app_ghcr_login: "{{ app_ghcr_token | length > 0 }}"
  when: app_image | length > 0
  block:
    - name: Log in to the container registry
      community.docker.docker_login:
        registry_url: "{{ app_ghcr_registry }}"
        username: "{{ app_ghcr_username }}"
        password: "{{ app_ghcr_token }}"
        reauthorize: true
      no_log: true
      when: app_ghcr_login | bool

    # Compose recreates containers whose configuration (including .env values)
    # changed, but not ones whose bind-mounted files changed; force that case.
    - name: Pull and start the compose project
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: "{{ app_compose_pull }}"
        recreate: "{{ 'always' if (app_caddyfile is changed or app_secret_files is changed) else 'auto' }}"
        remove_orphans: true
        wait: true
        wait_timeout: "{{ app_compose_wait_timeout }}"

  always:
    - name: Log out of the container registry
      community.docker.docker_login:
        registry_url: "{{ app_ghcr_registry }}"
        state: absent
      when: app_ghcr_login | bool
