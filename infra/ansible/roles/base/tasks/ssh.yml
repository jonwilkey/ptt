---
# Debian's sshd_config starts with `Include /etc/ssh/sshd_config.d/*.conf`, and sshd
# keeps the first value it reads for each keyword, so a low-numbered drop-in wins
# over the rest of sshd_config and over cloud-init's 50-cloud-init.conf.
- name: Install the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ptt-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  changed_when: false
  register: base_sshd_effective
  when: not ansible_check_mode

- name: Check the hardening settings are in effect
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in base_sshd_lines"
      - "'passwordauthentication no' in base_sshd_lines"
      - "'kbdinteractiveauthentication no' in base_sshd_lines"
      - "'pubkeyauthentication yes' in base_sshd_lines"
      - "'x11forwarding no' in base_sshd_lines"
      - "('allowgroups ' ~ base_admin_group) in base_sshd_lines"
    fail_msg: >-
      sshd's effective configuration does not match 10-ptt-hardening.conf; is the
      sshd_config.d Include missing, or does another file set these first?
    quiet: true
  vars:
    base_sshd_lines: "{{ base_sshd_effective.stdout_lines }}"
  when: not ansible_check_mode
