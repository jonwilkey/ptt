---
- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present

- name: Install the snapshot script
  ansible.builtin.template:
    src: ptt-nightly-snapshot.j2
    dest: "{{ snapshot_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the snapshot units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ptt-snapshot.service
    - ptt-snapshot.timer
  notify: Reload systemd for the snapshot units

- name: Apply the unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the snapshot timer
  ansible.builtin.systemd_service:
    name: ptt-snapshot.timer
    enabled: true
    state: started
