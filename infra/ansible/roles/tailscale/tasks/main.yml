---
- name: Download the Tailscale apt signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_url }}/{{ tailscale_codename }}.noarmor.gpg"
    dest: "{{ tailscale_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the Tailscale apt repository
  ansible.builtin.copy:
    dest: "{{ tailscale_apt_source_file }}"
    content: |
      # Managed by Ansible.
      deb [signed-by={{ tailscale_apt_keyring }}] {{ tailscale_apt_url }} {{ tailscale_codename }} main
    owner: root
    group: root
    mode: "0644"
  register: tailscale_apt_source

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: "{{ tailscale_apt_source is changed }}"

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started

- name: Read the Tailscale status
  ansible.builtin.command: tailscale status --json
  changed_when: false
  failed_when: false
  check_mode: false
  register: tailscale_status

- name: Record the Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{ (tailscale_status.stdout | from_json).BackendState | default('Unknown')
         if tailscale_status.rc == 0 and tailscale_status.stdout | length > 0 else 'Unknown' }}

- name: Fail when Tailscale is down and no auth key was given
  ansible.builtin.fail:
    msg: >-
      Tailscale is {{ tailscale_backend_state }} and tailscale_auth_key is empty. Pass a
      pre-authorized key tagged {{ tailscale_tags | join(',') }} with -e tailscale_auth_key=...
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_auth_key | length == 0

- name: Join the tailnet
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --reset
      - "--auth-key={{ tailscale_auth_key }}"
      - "--advertise-tags={{ tailscale_tags | join(',') }}"
      - "--hostname={{ tailscale_hostname }}"
      - "--accept-dns={{ tailscale_accept_dns | lower }}"
  changed_when: true
  no_log: true
  when: tailscale_backend_state != 'Running'

- name: Read the Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  changed_when: false
  check_mode: false
  register: tailscale_prefs

- name: Set Tailscale DNS acceptance
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--accept-dns={{ tailscale_accept_dns | lower }}"
  changed_when: true
  when: (tailscale_prefs.stdout | from_json).CorpDNS | bool != tailscale_accept_dns | bool

- name: Restrict SSH to the tailnet
  ansible.builtin.import_tasks: ssh.yml
  when: tailscale_ssh_tailnet_only | bool
