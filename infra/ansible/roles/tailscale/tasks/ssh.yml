---
# sshd binds only to this node's Tailscale addresses. Lock-out guards: the addresses
# must be discovered and valid before the ListenAddress drop-in is written, and the
# config is checked with `sshd -t` before sshd restarts. Recovery: README.md.

- name: Read the Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  changed_when: false
  check_mode: false
  register: tailscale_ip4

- name: Read the Tailscale IPv6 address
  ansible.builtin.command: tailscale ip -6
  changed_when: false
  check_mode: false
  register: tailscale_ip6

- name: Check the Tailscale addresses were discovered
  ansible.builtin.assert:
    that:
      - tailscale_ip4.stdout_lines | length == 1
      - tailscale_ip4.stdout is match('^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$')
      - tailscale_ip6.stdout_lines | length == 1
      - tailscale_ip6.stdout is match('^fd7a:115c:a1e0:[0-9a-f:]+$')
    fail_msg: >-
      Could not read this node's Tailscale addresses (got '{{ tailscale_ip4.stdout }}' and
      '{{ tailscale_ip6.stdout }}'); not restricting sshd to them.
    quiet: true

# Socket activation would make sshd ignore ListenAddress (systemd would own port 22).
- name: Read the ssh.socket unit state
  ansible.builtin.systemd_service:
    name: ssh.socket
  check_mode: false
  register: tailscale_ssh_socket

- name: Check sshd is not socket-activated
  ansible.builtin.assert:
    that:
      - tailscale_ssh_socket.status.ActiveState | default('inactive') != 'active'
    fail_msg: >-
      ssh.socket is active, so ListenAddress would be ignored. Switch to ssh.service
      (systemctl disable --now ssh.socket; systemctl enable --now ssh.service) first.
    quiet: true

# sshd starts before tailscale0 has its addresses at boot; non-local bind lets it
# bind them anyway, and they start receiving traffic once tailscaled is up.
- name: Allow binding to addresses not yet assigned
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/60-ptt-nonlocal-bind.conf
    sysctl_set: true
    state: present
  loop:
    - net.ipv4.ip_nonlocal_bind
    - net.ipv6.ip_nonlocal_bind

- name: Create the ssh.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Start sshd after tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.service.d/10-ptt-after-tailscaled.conf
    content: |
      # Managed by Ansible. sshd listens on the Tailscale addresses only.
      [Unit]
      Wants=tailscaled.service
      After=tailscaled.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for sshd

- name: Make sshd listen only on the Tailscale addresses
  ansible.builtin.template:
    src: sshd-listen.conf.j2
    dest: /etc/ssh/sshd_config.d/20-ptt-listen.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd on the tailnet

- name: Read the effective sshd listen addresses
  ansible.builtin.command: /usr/sbin/sshd -T
  changed_when: false
  register: tailscale_sshd_effective
  when: not ansible_check_mode

- name: Check sshd will listen only on the Tailscale addresses
  ansible.builtin.assert:
    that:
      - tailscale_listen | sort == tailscale_expected | sort
    fail_msg: "sshd would listen on {{ tailscale_listen }}, expected {{ tailscale_expected }}."
    quiet: true
  vars:
    tailscale_listen: "{{ tailscale_sshd_effective.stdout_lines | select('match', '^listenaddress ') | list }}"
    tailscale_expected:
      - "listenaddress {{ tailscale_ip4.stdout }}:22"
      - "listenaddress [{{ tailscale_ip6.stdout }}]:22"
  when: not ansible_check_mode
