version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      # Every suppression names its linter and says why.
      require-specific: true
      require-explanation: true
    govet:
      enable-all: true
      disable:
        # Field order is chosen for readability, not padding.
        - fieldalignment
        # Shadowed err in nested scopes is idiomatic Go.
        - shadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    # sqlc output is generated; don't lint it.
    generated: strict
    presets:
      - std-error-handling
    rules:
      # Tests build SQL and file paths from fixed fixtures.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jonwilkey/ptt/server
  exclusions:
    generated: strict
