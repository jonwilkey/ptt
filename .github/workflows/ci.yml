name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR, so a new push cancels the superseded run. Pushes to main group by commit:
  # a shared group would let GitHub drop queued main runs, and every main commit must be tested.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CLI tool versions, kept current by the regex custom manager in renovate.json (it reads the
  # "# renovate:" comment above each line). Actions are pinned by SHA and tracked natively.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=github-releases depName=sqlc-dev/sqlc extractVersion=^v(?<version>.+)$
  SQLC_VERSION: 1.31.1
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # A Renovate bump of this version fails the gitleaks job until GITLEAKS_SHA256 is updated
  # to match, which is the intended review point.
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  server:
    name: server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server

      # Includes the migration up/down test (TestMigrationsUpDownUp in internal/db).
      - name: Test
        run: go test -race ./...

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: sqlc drift check
        run: make sqlc-check

      - name: govulncheck
        run: make vuln GOVULNCHECK="go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Build
        run: make build VERSION="ci-${GITHUB_SHA::12}"

  server-image:
    name: server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=ci-${{ github.sha }}
          tags: pttd:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Not the release smoke test (that runs with test devices in server-release); this only
      # proves the image starts under the production runtime restrictions.
      - name: Image runs read-only as nonroot and turns healthy
        run: |
          docker volume create pttd-ci-data
          docker run -d --name pttd \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v pttd-ci-data:/data \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:9090:9090 \
            pttd:ci
          for _ in $(seq 30); do
            if docker exec pttd /pttd healthcheck; then break; fi
            sleep 1
          done
          docker exec pttd /pttd healthcheck
          test "$(docker inspect --format '{{.Config.User}}' pttd)" = "65532:65532"
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          curl -fsS http://127.0.0.1:9090/metrics | grep '^pttd_active_sessions 0$'
          docker exec pttd /pttd admin status
          docker stop pttd
          test "$(docker inspect --format '{{.State.ExitCode}}' pttd)" = "0"

      - name: Container logs
        if: always()
        run: docker logs pttd || true

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      # The runner image ships shellcheck, so run: blocks are checked too.
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -color

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OSV-Scanner exits non-zero on any finding; the next step applies the severity gate.
      - name: Scan lockfiles
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --recursive
            ./

      # Fails on CVSS >= 7.0 (high or critical). Unscored findings, which include most Go
      # advisories, are reported as warnings; govulncheck in the server job gates those by
      # reachability.
      - name: Fail on high or critical findings
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::OSV-Scanner wrote no results; see the 'Scan lockfiles' step."
            exit 1
          fi
          jq -r '
            .results[]? | .source.path as $src | .packages[]? | .package as $p | .groups[]? |
            [(.max_severity // "" | if . == "" then "unscored" else . end),
             "\($p.ecosystem)/\($p.name)@\($p.version)", (.ids | join(",")), $src] | @tsv
          ' osv-results.json > findings.tsv
          if [ ! -s findings.tsv ]; then
            # A non-zero exit with nothing to report means the scan itself broke.
            if [ "$SCAN_OUTCOME" = "failure" ]; then
              echo "::error::OSV-Scanner failed but reported no findings; see the 'Scan lockfiles' step."
              exit 1
            fi
            echo "No known vulnerabilities."
            exit 0
          fi
          column -t -s "$(printf '\t')" -N SEVERITY,PACKAGE,IDS,SOURCE findings.tsv
          awk -F '\t' '$1 == "unscored" { printf "::warning::Unscored advisory %s in %s\n", $3, $2 }' findings.tsv
          high=$(awk -F '\t' '$1 != "unscored" && $1 + 0 >= 7.0' findings.tsv | wc -l)
          if [ "$high" -gt 0 ]; then
            echo "::error::${high} high or critical (CVSS >= 7.0) finding(s)."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          version="${GITLEAKS_VERSION#v}"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$tarball" "$base/$tarball"
          curl -fsSLo checksums.txt "$base/gitleaks_${version}_checksums.txt"
          # The hash pinned in this workflow is authoritative; the release's checksums file must
          # agree with it, and so must the downloaded tarball.
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" checksums.txt
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # PRs scan only their own commits; pushes to main scan the full history.
      - name: Scan git history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --redact --no-banner .
          fi
