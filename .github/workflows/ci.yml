name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR, so a new push cancels the superseded run. Pushes to main group by commit:
  # a shared group would let GitHub drop queued main runs, and every main commit must be tested.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CLI tool versions, kept current by the regex custom manager in renovate.json (it reads the
  # "# renovate:" comment above each line). Actions are pinned by SHA and tracked natively.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=github-releases depName=sqlc-dev/sqlc extractVersion=^v(?<version>.+)$
  SQLC_VERSION: 1.31.1
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # A Renovate bump of this version fails the gitleaks job until GITLEAKS_SHA256 is updated
  # to match, which is the intended review point.
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  server:
    name: server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server

      # Includes the migration up/down test (TestMigrationsUpDownUp in internal/db).
      - name: Test
        run: go test -race ./...

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: sqlc drift check
        run: make sqlc-check

      - name: govulncheck
        run: make vuln GOVULNCHECK="go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Build
        run: make build VERSION="ci-${GITHUB_SHA::12}"

  server-image:
    name: server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=ci-${{ github.sha }}
          tags: pttd:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Not the release smoke test (that runs with test devices in server-release); this only
      # proves the image starts under the production runtime restrictions.
      - name: Image runs read-only as nonroot and turns healthy
        run: |
          docker volume create pttd-ci-data
          docker run -d --name pttd \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v pttd-ci-data:/data \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:9090:9090 \
            pttd:ci
          for _ in $(seq 30); do
            if docker exec pttd /pttd healthcheck; then break; fi
            sleep 1
          done
          docker exec pttd /pttd healthcheck
          test "$(docker inspect --format '{{.Config.User}}' pttd)" = "65532:65532"
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          curl -fsS http://127.0.0.1:9090/metrics | grep '^pttd_active_sessions 0$'
          docker exec pttd /pttd admin status
          docker stop pttd
          test "$(docker inspect --format '{{.State.ExitCode}}' pttd)" = "0"

      - name: Container logs
        if: always()
        run: docker logs pttd || true

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      # The runner image ships shellcheck, so run: blocks are checked too.
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -color

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OSV-Scanner exits non-zero on any finding; the next step applies the severity gate.
      - name: Scan lockfiles
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --recursive
            ./

      # Fails on CVSS >= 7.0 (high or critical). Unscored findings, which include most Go
      # advisories, are reported as warnings; govulncheck in the server job gates those by
      # reachability.
      - name: Fail on high or critical findings
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::OSV-Scanner wrote no results; see the 'Scan lockfiles' step."
            exit 1
          fi
          jq -r '
            .results[]? | .source.path as $src | .packages[]? | .package as $p | .groups[]? |
            [(.max_severity // "" | if . == "" then "unscored" else . end),
             "\($p.ecosystem)/\($p.name)@\($p.version)", (.ids | join(",")), $src] | @tsv
          ' osv-results.json > findings.tsv
          if [ ! -s findings.tsv ]; then
            # A non-zero exit with nothing to report means the scan itself broke.
            if [ "$SCAN_OUTCOME" = "failure" ]; then
              echo "::error::OSV-Scanner failed but reported no findings; see the 'Scan lockfiles' step."
              exit 1
            fi
            echo "No known vulnerabilities."
            exit 0
          fi
          column -t -s "$(printf '\t')" -N SEVERITY,PACKAGE,IDS,SOURCE findings.tsv
          awk -F '\t' '$1 == "unscored" { printf "::warning::Unscored advisory %s in %s\n", $3, $2 }' findings.tsv
          high=$(awk -F '\t' '$1 != "unscored" && $1 + 0 >= 7.0' findings.tsv | wc -l)
          if [ "$high" -gt 0 ]; then
            echo "::error::${high} high or critical (CVSS >= 7.0) finding(s)."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          version="${GITLEAKS_VERSION#v}"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$tarball" "$base/$tarball"
          curl -fsSLo checksums.txt "$base/gitleaks_${version}_checksums.txt"
          # The hash pinned in this workflow is authoritative; the release's checksums file must
          # agree with it, and so must the downloaded tarball.
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" checksums.txt
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # PRs scan only their own commits; pushes to main scan the full history.
      - name: Scan git history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --redact --no-banner .
          fi

  # ---- OpenTofu (infra/tofu) -------------------------------------------------------------
  #
  # The repository and its Actions logs are public: identifying values come only from secrets
  # (masked in logs), and the human-readable plan is never printed. Only a summary (counts plus
  # "<actions> <address>" lines) goes to the log and the PR comment.

  tofu:
    name: OpenTofu fmt and validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff infra/tofu

      - name: tofu init and validate
        run: |
          for dir in infra/tofu/bootstrap infra/tofu/prod; do
            echo "::group::${dir}"
            tofu -chdir="${dir}" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="${dir}" validate
            echo "::endgroup::"
          done

  tofu-plan:
    name: OpenTofu plan (prod)
    needs: tofu
    # Only after bootstrap (TOFU_ENABLED), only for PRs from this repository: fork PRs get no
    # OIDC token or secrets. Never switch this to pull_request_target.
    if: >-
      vars.TOFU_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for the ptt-tofu-plan role (sub ...:pull_request)
      pull-requests: write # sticky plan-summary comment
    concurrency:
      group: tofu-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base parent

      - name: Detect infra/tofu changes
        id: changes
        run: |
          if git diff --quiet HEAD^1 HEAD -- infra/tofu; then
            echo "tofu=false" >> "$GITHUB_OUTPUT"
          else
            echo "tofu=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.changes.outputs.tofu == 'true'
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.changes.outputs.tofu == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_TOFU_PLAN_ROLE_ARN }}
          role-session-name: tofu-plan-pr-${{ github.event.pull_request.number }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: tofu init
        if: steps.changes.outputs.tofu == 'true'
        working-directory: infra/tofu/prod
        env:
          TOFU_STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
        run: tofu init -input=false -no-color -lockfile=readonly -backend-config="bucket=${TOFU_STATE_BUCKET}" > /dev/null

      - name: tofu plan
        id: plan
        if: steps.changes.outputs.tofu == 'true'
        working-directory: infra/tofu/prod
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY_PLAN }}
          TF_VAR_zone_name: ${{ secrets.TOFU_ZONE_NAME }}
          TF_VAR_record_name: ${{ secrets.TOFU_RECORD_NAME }}
          TF_VAR_admin_users: ${{ secrets.TOFU_ADMIN_USERS }}
        # Discards the human-readable plan and error text (public log); sets the exitcode output.
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/tofu-plan.sh" "$RUNNER_TEMP/prod.tfplan"

      - name: Summarize plan
        # outcome first: when tofu plan is skipped (no infra/tofu changes) its exitcode output is
        # null, and GitHub's loose == treats null == '0' as true.
        if: >-
          steps.plan.outcome == 'success' &&
          (steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2')
        working-directory: infra/tofu/prod
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/tofu-plan-summary.sh" "$RUNNER_TEMP/prod.tfplan" > "$RUNNER_TEMP/summary.txt"
          rm -f "$RUNNER_TEMP/prod.tfplan"
          cat "$RUNNER_TEMP/summary.txt"

      - name: Post plan summary as a sticky PR comment
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY_FILE: ${{ runner.temp }}/summary.txt
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tofu-plan:infra/tofu/prod -->';
            const code = process.env.PLAN_EXITCODE;
            const status = { '0': 'No changes', '2': 'Changes planned' }[code] ?? 'Plan failed';
            let summary = '';
            if (code === '0' || code === '2') {
              try {
                summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8').trim();
              } catch {
                summary = '(summary unavailable; see the run)';
              }
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              marker,
              '### OpenTofu plan: `infra/tofu/prod`',
              '',
              `**${status}** for ${context.payload.pull_request.head.sha.slice(0, 7)} ([run](${run}))`,
            ];
            if (summary) {
              lines.push('', '```text', summary, '```');
            }
            lines.push(
              '',
              '_Summary only (resource addresses and actions). The full plan is not published ' +
                'because this repository is public; run `tofu plan` locally to see details._',
            );
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error::tofu plan failed; see the plan step log."
          exit 1

  ansible:
    name: Ansible (syntax check, ansible-lint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ansible tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --quiet \
            ansible-core==2.21.5 ansible-lint==26.10.1 yamllint==1.38.0
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check
        run: |
          ansible-playbook -i inventory/prod.yml --syntax-check site.yml
          ansible-playbook -i inventory/prod.yml --syntax-check deploy.yml
      - name: yamllint
        run: yamllint -s .
      - name: ansible-lint
        run: ansible-lint

  # ---- Runtime (deploy/) -----------------------------------------------------------------
  #
  # The production compose file with the CI override (local image, named volumes, Caddy's
  # internal CA), checked from outside by the same smoke test that runs after deploys.

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_FILE: deploy/compose.yaml:deploy/compose.ci.yaml
      # compose.yaml requires both; compose.ci.yaml pins the values actually used.
      PTTD_IMAGE: ptt/pttd:ci
      PTT_DOMAIN: ptt.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The daemon.json settings that change how containers are reached, as in production.
      - uses: ./.github/actions/docker-daemon-prod

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=ci-${{ github.sha }}
          tags: ptt/pttd:ci
          load: true
          push: false
          # Reads the server-image job's cache; only that job writes it.
          cache-from: type=gha

      # The CI stack runs `tls internal`; this checks what production (PTT_TLS=acme) would run.
      - name: Production Caddyfile adapts as intended
        run: |
          set -euo pipefail
          image="$(docker compose config --format json | jq -r '.services.caddy.image')"
          docker run --rm -e PTT_DOMAIN=ptt.example.com -e PTT_TLS=acme -e ACME_EMAIL= \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            caddy adapt --config /etc/caddy/Caddyfile > "$RUNNER_TEMP/caddy-prod.json"
          failed=0
          assert() { # assert <description> <jq filter that must be true>
            if jq -e "$2" "$RUNNER_TEMP/caddy-prod.json" > /dev/null; then
              echo "ok    $1"
            else
              echo "::error::Caddyfile: $1"
              failed=1
            fi
          }
          assert "admin API disabled" '.admin.disabled == true'
          assert "exactly one automation policy, Let's Encrypt only" '
            (.apps.tls.automation.policies | length) == 1 and
            .apps.tls.automation.policies[0].issuers ==
              [{"module": "acme", "ca": "https://acme-v02.api.letsencrypt.org/directory"}]'
          assert "every SNI-matched TLS policy is TLS 1.3 only" '
            [.apps.http.servers[] | .tls_connection_policies // [] | .[] | select(.match.sni)]
            | length > 0 and all(.protocol_min == "tls1.3")'
          assert "no access logs" '[.apps.http.servers[] | select(has("logs"))] == []'
          assert "log filter deletes the client address" '
            .logging.logs.default.encoder.fields["request>remote_ip"].filter == "delete"'
          if [ "$failed" -ne 0 ]; then
            jq . "$RUNNER_TEMP/caddy-prod.json"
          fi
          exit "$failed"

      # Shared with server-release's smoke job: start the stack, smoke.sh over IPv4 and IPv6,
      # container hardening.
      - uses: ./.github/actions/compose-smoke

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v --timeout 30 || true
